<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCP - Reacciona Control de Procesos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#123b8f">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #d71920;
      --rojo-oscuro: #a30f15;
      --azul: #123b8f;
      --azul-oscuro: #0b2559;
      --fondo: #f3f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Figtree', Arial, sans-serif; background: var(--fondo); color: #1f2937; }

    /* ENCABEZADO */
    header { background: linear-gradient(135deg, var(--azul-oscuro), var(--azul)); color: white; border-bottom: 5px solid var(--rojo); position: sticky; top: 0; z-index: 50; }
    .barra { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 12px 18px; }
    .hamburguesa { background: transparent; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .hamburguesa span { display: block; width: 28px; height: 3px; background: white; border-radius: 2px; }
    .hamburguesa:hover span { background: #ffd0d2; }
    .marca { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .logo-aro { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: transparent; }
    #logo { width: 110%; height: 110%; max-width: none; margin: -5%; display: block; }
    .logo-texto { width: 64px; height: 64px; border-radius: 50%; background: var(--rojo); border: 3px solid white; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; letter-spacing: 1px; }
    .marca h1 { font-family: 'Bricolage Grotesque', Arial, sans-serif; font-size: 24px; line-height: 1.1; }
    .marca p { font-size: 14px; opacity: 0.9; margin-top: 3px; }

    /* MENU LATERAL */
    #fondoMenu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 80; }
    #fondoMenu.abierto { display: block; }
    #menu { position: fixed; top: 0; left: 0; bottom: 0; width: 310px; max-width: 88%; background: white; z-index: 90; transform: translateX(-100%); transition: transform 0.25s; display: flex; flex-direction: column; box-shadow: 4px 0 18px rgba(0,0,0,0.25); }
    #menu.abierto { transform: translateX(0); }
    .menu-cab { background: var(--azul); color: white; padding: 16px 18px; border-bottom: 4px solid var(--rojo); display: flex; align-items: center; gap: 12px; }
    .menu-cab .aro { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: white; }
    .menu-cab .aro img { width: 110%; height: 110%; max-width: none; margin: -5%; display: block; }
    .menu-cab .tit { flex: 1; font-family: 'Bricolage Grotesque', Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .menu-cab button { background: none; border: none; color: white; font-size: 28px; cursor: pointer; width: 40px; height: 40px; }
    .menu-lista { padding: 8px 12px; overflow-y: auto; flex: 1; }
    .menu-titulo { padding: 14px 8px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5b6b8c; }
    .menu-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 7px 8px; margin-bottom: 2px; border: none; border-radius: 14px; background: transparent; color: var(--azul-oscuro); font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; }
    .menu-item:hover, .menu-item:active { background: var(--rojo); color: white; }
    .menu-item .ico { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #e6edfb; color: var(--azul); }
    .menu-item .ico.alerta { background: #fde8e9; color: var(--rojo); }
    .menu-item:hover .ico, .menu-item:active .ico { background: rgba(255,255,255,0.22); color: white; }
    .menu-item .txt { flex: 1; }
    .menu-item .trail { display: flex; color: #8a97b3; }
    .menu-item:hover .trail, .menu-item:active .trail { color: white; }
    .ico svg, .trail svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .trail svg { width: 18px; height: 18px; }
    .submenu { margin: 0 0 8px 24px; padding-left: 10px; border-left: 3px solid var(--azul); }
    .submenu .menu-item { padding: 10px 12px; margin-bottom: 4px; font-size: 15px; background: #f6f8fc; }
    .submenu .menu-item:hover, .submenu .menu-item:active { background: var(--rojo); color: white; }
    .menu-pie { padding: 12px 14px 20px; border-top: 1px solid #e3e8f2; display: flex; flex-direction: column; gap: 8px; }
    .btn-compartir { display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border: none; border-radius: 14px; background: var(--azul); color: white; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-compartir:hover, .btn-compartir:active { background: var(--rojo); }
    .btn-compartir svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .menu-ver { text-align: center; font-size: 12px; color: #5b6b8c; }

    /* AVISO DE NOVEDAD */
    .nuevo { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 8px; margin-left: 10px; border-radius: 12px; background: #16a34a; color: white; font-size: 13px; font-weight: bold; flex-shrink: 0; }
    .check-verde { margin-left: 14px; color: #16a34a; font-size: 28px; font-weight: bold; line-height: 1; }
    .menu-item:hover .check-verde { color: white; }
    .hamburguesa { position: relative; }
    #puntoNuevo { display: none; position: absolute; top: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid white; }

    /* CONTENIDO */
    .contenedor { max-width: 1100px; margin: 20px auto; padding: 0 18px; }
    .nav-fila { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .volver { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; height: 40px; padding: 0 14px 0 10px; border: none; border-radius: 12px; background: var(--rojo); color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .volver:hover { background: var(--rojo-oscuro); }
    .volver svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ruta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; min-width: 0; }
    .ruta a { color: #5b6b8c; cursor: pointer; }
    .ruta a:last-child { color: var(--azul-oscuro); font-weight: 600; }
    .ruta a:hover { text-decoration: underline; }
    .ruta span { color: #8a97b3; }
    .buscador { width: 100%; height: 46px; padding: 0 14px; font-family: inherit; font-size: 16px; border: 1.5px solid #d4dbea; border-radius: 14px; margin-bottom: 16px; outline: none; background: white; }
    .buscador:focus { border-color: var(--azul); }
    .seccion { background: white; padding: 20px 18px; border-radius: 18px; box-shadow: 0 2px 10px rgba(11,37,89,0.08); border-top: 4px solid var(--azul); }
    .seccion h2 { font-family: 'Bricolage Grotesque', Arial, sans-serif; color: var(--azul-oscuro); font-size: 24px; margin-bottom: 14px; }
    h3 { color: #5b6b8c; margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    .anio { margin-bottom: 14px; }
    .anio-titulo { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5b6b8c; margin-bottom: 6px; }
    .sem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sem { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 12px 14px; border: 3px solid var(--azul); border-radius: 18px; background: var(--azul); color: white; font-family: inherit; text-align: left; cursor: pointer; transition: 0.2s; }
    .sem:hover { background: var(--rojo); border-color: var(--rojo); }
    .sem.actual { border-color: var(--rojo); }
    .sem-num { font-family: 'Bricolage Grotesque', Arial, sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1; }
    .sem-nom { font-size: 17px; font-weight: 500; }
    .sem-sub { font-size: 13px; opacity: 0.85; }
    .carpeta { height: 48px; padding: 0 16px; border: none; border-radius: 14px; background: var(--azul); color: white; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .carpeta:hover { background: var(--rojo); transform: translateY(-2px); }
    .fila { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px 8px 12px; border: 1px solid #e3e8f2; border-radius: 14px; background: white; color: var(--azul-oscuro); font-family: inherit; font-size: 16px; font-weight: 500; text-align: left; text-decoration: none; cursor: pointer; box-shadow: 0 1px 6px rgba(11,37,89,0.06); word-break: break-word; }
    .fila:hover { background: #fde4e5; border-color: var(--rojo); }
    .fila .txt { flex: 1; min-width: 0; }
    .fila .nom { font-size: 15px; }
    .fila .fec { font-size: 12px; font-weight: 400; color: #5b6b8c; margin-top: 2px; }
    .ico-carpeta svg { width: 24px; height: 24px; fill: #e6edfb; stroke: var(--azul); stroke-width: 1.8; stroke-linejoin: round; display: block; }
    .fila .trail { display: flex; color: #8a97b3; }
    .fila .trail svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ext { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; background: #eef1f8; color: #4a5568; }
    .ext.pdf { background: #fde8e9; color: #b3141b; }
    .ext.img { background: #e6edfb; color: #123b8f; }
    .ext.doc { background: #e3f0ff; color: #1d5fb4; }
    .ext.xls { background: #e2f5e8; color: #15803d; }
    .ext.ppt { background: #fdecd9; color: #b45309; }
    .aviso-card { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 16px; padding: 14px 16px; border: none; border-radius: 18px; background: white; box-shadow: 0 2px 10px rgba(11,37,89,0.08); font-family: inherit; color: var(--azul-oscuro); text-align: left; cursor: pointer; }
    .aviso-card:hover { background: #fde4e5; }
    .aviso-card .ico { width: 44px; height: 44px; border-radius: 14px; background: #fde8e9; color: var(--rojo); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .aviso-card .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .aviso-card .cuerpo { flex: 1; min-width: 0; }
    .aviso-card .rot { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6b8c; }
    .aviso-card .rot .nuevo { margin-left: 0; height: 20px; min-width: 0; font-size: 11px; text-transform: none; letter-spacing: 0; }
    .aviso-card .nom { font-size: 15px; font-weight: 600; margin-top: 2px; word-break: break-word; }
    .aviso-card .cuando { font-size: 12px; color: #5b6b8c; margin-top: 2px; }
    .aviso-card .trail { display: flex; color: #8a97b3; }
    .aviso-card .trail svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .msg { color: #6b7280; padding: 10px 0; }
    .error { color: #b91c1c; }

    /* VISOR */
    #visor { display: none; position: fixed; inset: 0; z-index: 100; background: #111; flex-direction: column; }
    #visor.abierto { display: flex; }
    .visor-barra { display: flex; align-items: center; gap: 12px; padding: 10px 15px; background: var(--azul); border-bottom: 3px solid var(--rojo); color: white; }
    .visor-barra button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--rojo); color: white; font-size: 16px; cursor: pointer; }
    .visor-barra button:hover { background: var(--rojo-oscuro); }
    .visor-barra .nombre { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .visor-barra a { color: white; font-size: 14px; white-space: nowrap; }
    #visorFrame { flex: 1; width: 100%; border: none; background: white; }
    #visorImgWrap { display: none; position: relative; flex: 1; min-height: 0; align-items: center; justify-content: center; overflow: hidden; background: #111; touch-action: pan-y pinch-zoom; }
    #visorImg { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; transition: opacity .2s; user-select: none; -webkit-user-drag: none; }
    .flecha { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 44px; height: 64px; border: none; border-radius: 10px; background: rgba(0,0,0,.45); color: white; font-size: 34px; line-height: 1; cursor: pointer; }
    .flecha.izq { left: 8px; }
    .flecha.der { right: 8px; }
    .flecha:disabled { opacity: .25; cursor: default; }
    #visorPos { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 4px 12px; border-radius: 12px; background: rgba(0,0,0,.55); color: white; font-size: 14px; }

    footer { margin-top: 50px; padding: 22px; text-align: center; background: var(--azul-oscuro); color: white; border-top: 5px solid var(--rojo); }

    @media (max-width: 600px) {
      .logo-aro, .logo-texto { height: 50px; width: 50px; }
      .marca h1 { font-size: 18px; }
      .marca p { font-size: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="barra">
      <button class="hamburguesa" onclick="abrirMenu()" aria-label="Abrir menú">
        <span></span><span></span><span></span><i id="puntoNuevo"></i>
      </button>
      <div class="marca" onclick="irInicio()">
        <span class="logo-aro" id="logoAro"><img id="logo" src="logo.png" alt="Logo RCP"
             onerror="document.getElementById('logoAro').style.display='none';document.getElementById('logoTexto').style.display='flex';"></span>
        <div id="logoTexto" class="logo-texto">RCP</div>
        <div>
          <h1>RCP</h1>
          <p>Reacciona Control de Procesos</p>
        </div>
      </div>
    </div>
  </header>

  <div id="sinRed" style="display:none;background:#fff3cd;color:#664d03;text-align:center;padding:8px 12px;font-size:14px;">
    Sin conexión: se muestran las carpetas que ya abriste antes. Los archivos necesitan internet.
  </div>

  <div id="fondoMenu" onclick="cerrarMenu()"></div>
  <nav id="menu">
    <div class="menu-cab">
      <span class="aro"><img src="logo.png" alt="" onerror="this.parentNode.style.display='none'"></span>
      <span class="tit">Menú</span>
      <button onclick="cerrarMenu()" aria-label="Cerrar menú">×</button>
    </div>
    <div class="menu-lista" id="menuLista"></div>
    <div class="menu-pie" id="menuPie"></div>
  </nav>

  <main class="contenedor">
    <div id="avisoDestacado" style="display:none"></div>
    <div id="navFila" class="nav-fila" style="display:none">
      <button id="btnVolver" class="volver" onclick="volver()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Volver</button>
      <div id="ruta" class="ruta"></div>
    </div>
    <input type="text" id="buscador" class="buscador" placeholder="Buscar en esta carpeta..." oninput="filtrar()" style="display:none">
    <section class="seccion">
      <h2 id="titulo">Cargando...</h2>
      <div id="contenido"></div>
    </section>
  </main>

  <div id="visor">
    <div class="visor-barra">
      <button onclick="cerrarVisor()">← Volver</button>
      <span class="nombre" id="visorNombre"></span>
      <a id="visorLink" href="#" target="_blank" rel="noopener">Abrir en Drive</a>
    </div>
    <div id="visorImgWrap">
      <button id="visorPrev" class="flecha izq" onclick="visorMover(-1)" aria-label="Imagen anterior">‹</button>
      <img id="visorImg" alt="" draggable="false" referrerpolicy="no-referrer">
      <button id="visorNext" class="flecha der" onclick="visorMover(1)" aria-label="Imagen siguiente">›</button>
      <span id="visorPos"></span>
    </div>
    <iframe id="visorFrame" allow="autoplay" allowfullscreen></iframe>
  </div>

  <footer>RCP · Reacciona Control de Procesos · Ingeniería de Control de Procesos<br><small style="opacity:.6">v18</small></footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMtQkbagMPvafgXhxXQHyKOQMWFqwWsA4SAkrPknShFYXE-1kKy4UVDC7yhWAiFIc__A/exec";

    const cache = {};
    let raiz = null;      // datos de la carpeta raíz
    let camino = [];      // [{id, name}]
    let actual = null;    // carpeta abierta
    let enInicio = true;  // true = pantalla principal (solo semestres)

    const esSemestre = (n) => /^semestre/i.test(n.trim());

    /* ICONOS (trazos simples, mismo estilo en todo el menú) */
    const IC = {
      casa: "M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",
      aviso: "M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4",
      info: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v6M12 7.5h.01",
      oferta: "M3 12V4h8l10 10-8 8zM7.5 8.5h.01",
      malla: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
      carpeta: "M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
      archivo: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5",
      perfil: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c.8-4 4-6 8-6s7.2 2 8 6",
      escuela: "M4 21V9l8-5 8 5v12M9 21v-6h6v6",
      libro: "M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21h15",
      musica: "M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z",
      compartir: "M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5",
      der: "M9 5l7 7-7 7",
      abajo: "M5 9l7 7 7-7",
      arriba: "M5 15l7-7 7 7",
      externo: "M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
    };
    const svgIcono = (d) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>';
    const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    function fechaCorta(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.getDate() + " " + MESES[d.getMonth()];
    }
    function haceTexto(ms) {
      const dias = Math.floor((Date.now() - ms) / 86400000);
      if (dias <= 0) return "hoy";
      if (dias === 1) return "ayer";
      if (dias < 30) return "hace " + dias + " días";
      return "el " + fechaCorta(ms);
    }
    function tipoArchivo(nombre) {
      const m = /\.([a-z0-9]+)$/i.exec(nombre.trim());
      const ext = m ? m[1].toLowerCase() : "";
      let clase = "";
      if (ext === "pdf") clase = "pdf";
      else if (/^(jpe?g|png|gif|webp|bmp|heic|heif)$/.test(ext)) clase = "img";
      else if (/^(docx?|odt|rtf|txt)$/.test(ext)) clase = "doc";
      else if (/^(xlsx?|csv|ods)$/.test(ext)) clase = "xls";
      else if (/^(pptx?|odp)$/.test(ext)) clase = "ppt";
      const etiqueta = ext === "jpeg" ? "JPG" : (ext ? ext.slice(0, 4).toUpperCase() : "ARCH");
      return { etiqueta: etiqueta, clase: clase };
    }
    function nombreSinExt(nombre) { return nombre.replace(/\.[a-z0-9]{1,5}$/i, ""); }


    /* NOVEDADES: se compara la última modificación en Drive con lo que el usuario ya vio */
    const VISTO_KEY = "rcp_visto";
    let umbralNuevo = null; // fecha a partir de la cual un archivo cuenta como nuevo
    function leerVisto() {
      try { return JSON.parse(localStorage.getItem(VISTO_KEY)) || {}; } catch (e) { return {}; }
    }
    function marcarVisto(id, t) {
      const v = leerVisto();
      v[id] = t;
      try { localStorage.setItem(VISTO_KEY, JSON.stringify(v)); } catch (e) {}
    }
    const fechaCarpeta = (f) => f.latest || f.updated || 0;
    const esNuevo = (f) => fechaCarpeta(f) > (leerVisto()[f.id] || 0);
    function crearBadge(t) {
      const s = document.createElement("span");
      s.className = "nuevo";
      s.textContent = t;
      return s;
    }

    async function cargar(id) {
      const clave = id || "root";
      if (cache[clave]) return cache[clave];
      const url = id ? API_URL + "?id=" + encodeURIComponent(id) : API_URL;
      try {
        const r = await fetch(url);
        const d = await r.json();
        if (!d.ok) throw new Error(d.error);
        cache[clave] = d;
        try { localStorage.setItem("rcp_" + clave, JSON.stringify(d)); } catch (e) {}
        return d;
      } catch (e) {
        // Sin internet: usar la última copia guardada de esta carpeta
        let guardado = null;
        try { guardado = localStorage.getItem("rcp_" + clave); } catch (e2) {}
        if (guardado) {
          const d = JSON.parse(guardado);
          cache[clave] = d;
          return d;
        }
        throw new Error("sin conexión y esta carpeta aún no se ha abierto antes");
      }
    }

    /* DIAGNÓSTICO: abrir la página con ?debug al final de la dirección */
    function mostrarDebug() {
      const av = raiz.folders.find(f => /^avisos/i.test(f.name.trim()));
      let box = document.getElementById("debugBox");
      if (!box) {
        box = document.createElement("pre");
        box.id = "debugBox";
        box.style.cssText = "background:#111;color:#0f0;padding:12px;margin:0;font-size:13px;white-space:pre-wrap;position:relative;z-index:60;";
        document.body.insertBefore(box, document.body.firstChild);
      }
      box.textContent = "VERSION v18\nCarpetas recibidas: " + raiz.folders.length +
        "\nAVISOS: " + (av ? "encontrado" : "NO encontrado") +
        (av ? "\nlatest: " + av.latest + "\nupdated: " + av.updated +
              "\nvisto antes: " + (leerVisto()[av.id] || "nunca") +
              "\nnuevo: " + esNuevo(av) : "");
    }

    function mostrarError(e) {
      document.getElementById("contenido").innerHTML =
        '<p class="msg error">No se pudo cargar: ' + e.message + '</p>';
    }

    /* HISTORIAL: el botón o gesto "Atrás" del celular sube un nivel */
    let restaurando = false;
    let primeraVista = true;
    let origenMenu = false;  // true si la carpeta se abrió desde el menú de las tres rayitas
    let vistaPrevia = null;  // dónde estaba la persona antes de abrir esa carpeta del menú
    function vistaActual() { return { v: enInicio ? "i" : "c", camino: camino.slice(), m: origenMenu }; }
    function registrarVista() {
      if (restaurando) return;
      const est = vistaActual();
      if (primeraVista) {
        primeraVista = false;
        try { history.replaceState(est, ""); } catch (e) {}
        return;
      }
      const prev = history.state;
      if (prev && prev.v === est.v && JSON.stringify(prev.camino) === JSON.stringify(est.camino)) return;
      try { history.pushState(est, ""); } catch (e) {}
    }

    /* PANTALLA PRINCIPAL: solo semestres; el resto va al menú */
    async function irInicio() {
      cerrarMenu();
      document.getElementById("buscador").value = "";
      document.getElementById("contenido").innerHTML = '<p class="msg">Cargando...</p>';
      try {
        raiz = await cargar(null);
        umbralNuevo = null;
        origenMenu = false;
        camino = [{ id: raiz.id, name: raiz.name }];
        enInicio = true;
        actual = {
          id: raiz.id,
          name: "Semestres",
          folders: raiz.folders.filter(f => esSemestre(f.name)),
          files: []
        };
        dibujar(actual);
        armarMenu();
        registrarVista();
        dibujarAviso();
      } catch (e) { mostrarError(e); }
    }

    /* Tarjeta "Último aviso" de la pantalla principal */
    async function dibujarAviso() {
      const cont = document.getElementById("avisoDestacado");
      cont.style.display = "none";
      cont.innerHTML = "";
      const av = raiz && raiz.folders.find(f => /^avisos/i.test(f.name.trim()));
      if (!av) return;
      try {
        const d = await cargar(av.id);
        if (!enInicio) return;
        const ult = d.files.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
        if (!ult) return;
        const b = document.createElement("button");
        b.className = "aviso-card";
        b.innerHTML = '<span class="ico">' + svgIcono(IC.aviso) + '</span><span class="cuerpo"><span class="rot"></span><div class="nom"></div><div class="cuando"></div></span><span class="trail">' + svgIcono(IC.der) + '</span>';
        const rot = b.querySelector(".rot");
        rot.appendChild(document.createTextNode("Último aviso"));
        if (esNuevo(av)) rot.appendChild(crearBadge("✓ Nuevo"));
        b.querySelector(".nom").textContent = nombreSinExt(ult.name);
        b.querySelector(".cuando").textContent = "Subido " + haceTexto(ult.updated || 0);
        b.onclick = () => abrirCarpetaMenu(av);
        cont.appendChild(b);
        cont.style.display = "block";
      } catch (e) { /* sin datos: no se muestra la tarjeta */ }
    }

    let icpAbierto = false;
    function abrirCarpetaMenu(f) {
      cerrarMenu();
      const previo = leerVisto()[f.id];
      umbralNuevo = previo !== undefined ? previo : null;
      marcarVisto(f.id, fechaCarpeta(f));
      if (!origenMenu) vistaPrevia = vistaActual();
      origenMenu = true;
      camino = [{ id: raiz.id, name: raiz.name }];
      abrir(f.id, f.name);
      armarMenu();
    }

    function iconoCarpetaMenu(nombre) {
      if (/aviso/i.test(nombre)) return IC.aviso;
      if (/informaci/i.test(nombre)) return IC.info;
      if (/oferta|maestro/i.test(nombre)) return IC.oferta;
      if (/malla/i.test(nombre)) return IC.malla;
      return IC.carpeta;
    }

    function itemMenu(lista, o) {
      const b = document.createElement("button");
      b.className = "menu-item";
      const ico = document.createElement("span");
      ico.className = "ico" + (o.alerta ? " alerta" : "");
      ico.innerHTML = svgIcono(o.icono);

      tx.className = "txt";
      tx.textContent = o.texto;

      b.appendChild(tx);
      if (o.nuevo) b.appendChild(crearBadge("✓ Nuevo"));
      const tr = document.createElement("span");
      tr.className = "trail";
      tr.innerHTML = svgIcono(o.trail || IC.der);
      b.appendChild(tr);
      b.onclick = o.onclick;
      lista.appendChild(b);
      return b;
    }

    function tituloMenu(lista, texto) {
      const t = document.createElement("div");
      t.className = "menu-titulo";
      t.textContent = texto;
      lista.appendChild(t);
    }

    function armarMenu() {
      const lista = document.getElementById("menuLista");
      lista.innerHTML = "";
      itemMenu(lista, { texto: "Inicio", icono: IC.casa, onclick: irInicio });

      raiz.files.forEach(a => {

      /* enlaces externos: se abren en otra pestaña y el menú queda abierto, así al volver estás en el menú */
      const externo = (texto, icono, url) => itemMenu(lista, { texto: texto, icono: icono, trail: IC.externo, onclick: () => window.open(url, "_blank", "noopener") });

      tituloMenu(lista, "Enlaces");
      externo("Perfil UAGRM", IC.perfil, "https://perfil.uagrm.edu.bo/estudiantes/default.php");
      externo("UAGRM Presencial", IC.escuela, "https://presencial.uagrm.edu.bo/");

      /* Mi Carrera (ICP): submenú desplegable */
      const BASE_ICP = "https://www.uagrm.edu.bo/carreras/fcet-cicp";
      const SECCIONES_ICP = [
        ["Bienvenida", "bienvenida"], ["Creación", "creacion"], ["Marco Institucional", "marco-institucional"],
        ["Objetivo", "objetivo"], ["Perfil Profesional", "perfil-profesional"], ["Campo laboral", "campo-laboral"],
        ["Laboratorio", "laboratorio"], ["Malla Curricular", "malla-curricular"], ["Contacto", "contacto"]
      ];
      itemMenu(lista, { texto: "Mi Carrera (ICP)", icono: IC.libro, trail: icpAbierto ? IC.arriba : IC.abajo, onclick: () => { icpAbierto = !icpAbierto; armarMenu(); } });
      if (icpAbierto) {
        const sub = document.createElement("div");
        sub.className = "submenu";

          sub.appendChild(b);

      externo("TikTok RCP", IC.musica, "https://www.tiktok.com/@rcp_reaccionaprocesos");

      /* Pie: Compartir app (hoja de compartir del teléfono; si no existe, WhatsApp directo) */
      const pie = document.getElementById("menuPie");

      const compartir = document.createElement("button");
      compartir.className = "btn-compartir";
      compartir.innerHTML = svgIcono(IC.compartir) + "<span>Compartir app</span>";
      compartir.onclick = async () => {
        const enlace = "https://rcp91918-beep.github.io/rcp-control-procesos/";
        const texto = "🔵🔴 ¡Entra a la app de RCP! Encuentra los materiales de tus 10 semestres, avisos, malla curricular y más. Compártela con tus compañeros 👇\n" + enlace;
        if (navigator.share) {
          try { await navigator.share({ text: texto }); } catch (e) { /* el usuario canceló */ }
        } else {
          window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener");

      };

    async function abrir(id, nombre, nivel) {
      const cont = document.getElementById("contenido");
      document.getElementById("buscador").value = "";
      cont.innerHTML = '<p class="msg">Cargando...</p>';
      try {
        const d = await cargar(id);
        if (nivel === undefined) camino.push({ id: d.id, name: d.name });
        else camino = camino.slice(0, nivel + 1);
        enInicio = false;
        actual = d;
        dibujar(d);
        registrarVista();
      } catch (e) { mostrarError(e); }
    }

    /* orden fijo de las carpetas de cada materia; las demás quedan después, en su orden normal */
    function ordenCarpeta(nombre) {
      const n = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      if (/(primer|1er|1ro|1\s*°?)\s*parcial/.test(n)) return 1;
      if (/(segundo|2do|2\s*°?)\s*parcial/.test(n)) return 2;
      if (/examen\s*final|^final/.test(n)) return 3;
      if (/repechaje/.test(n)) return 4;
      if (/practic/.test(n)) return 5;
      return 99;
    }

    /* Pantalla principal: semestres en dos columnas, como tarjetas */
    const ACTUAL_KEY = "rcp_actual";
    function dibujarSemestres(cont, carpetas) {
      let actualId = null;
      try { actualId = localStorage.getItem(ACTUAL_KEY); } catch (e) {}
      const g = document.createElement("div");
      g.className = "sem-grid";
      carpetas.forEach(c => {
        const n = (c.name.match(/\d+/) || [""])[0];
        const b = document.createElement("button");
        b.className = "sem" + (c.id === actualId ? " actual" : "");
        b.innerHTML = '<span class="sem-num"></span><span class="sem-nom">Semestre</span><span class="sem-sub"></span>';
        b.querySelector(".sem-num").textContent = n || c.name.trim();
        if (!n) b.querySelector(".sem-nom").style.display = "none";
        const sub = b.querySelector(".sem-sub");
        sub.textContent = c.id === actualId ? "Tu semestre actual" : "\u00a0";
        b.onclick = () => {
          try { localStorage.setItem(ACTUAL_KEY, c.id); } catch (e) {}
          camino = [{ id: raiz.id, name: raiz.name }];
          origenMenu = false;
          abrir(c.id, c.name);
        };
        g.appendChild(b);
        if (c.id !== actualId) {
          cargar(c.id).then(d => {
            if (!enInicio) return;
            sub.textContent = d.folders.length + (d.folders.length === 1 ? " materia" : " materias");
          }).catch(() => {});
        }
      });
      cont.appendChild(g);
    }

    function dibujar(d, filtro) {
      const f = (filtro || "").toLowerCase();
      const carpetas = d.folders.filter(x => x.name.toLowerCase().includes(f)).sort((a, b) => ordenCarpeta(a.name) - ordenCarpeta(b.name));
      const archivos = d.files.filter(x => x.name.toLowerCase().includes(f));

      document.getElementById("titulo").innerText = d.name.trim();
      document.getElementById("navFila").style.display = enInicio ? "none" : "flex";
      document.getElementById("buscador").style.display = enInicio ? "none" : "block";
      if (!enInicio) {
        const av = document.getElementById("avisoDestacado");
        av.style.display = "none";
      }

      const ruta = document.getElementById("ruta");
      ruta.innerHTML = "";
      if (!enInicio) {
        camino.forEach((p, i) => {
          if (i > 0) ruta.insertAdjacentHTML("beforeend", "<span>›</span>");
          const a = document.createElement("a");
          a.textContent = i === 0 ? "Inicio" : p.name.trim();
          a.onclick = i === 0 ? irInicio : () => abrir(p.id, p.name, i);
          ruta.appendChild(a);
        });
      }

      const cont = document.getElementById("contenido");
      cont.innerHTML = "";

      if (enInicio) {
        if (carpetas.length) dibujarSemestres(cont, carpetas);
      } else if (carpetas.length) {
        const t = document.createElement("h3");
        t.textContent = "Carpetas";
        cont.appendChild(t);
        const g = document.createElement("div");
        g.className = "lista";
        carpetas.forEach(c => {
          const b = document.createElement("button");
          b.className = "fila";
          b.innerHTML = '<span class="ico-carpeta">' + svgIcono(IC.carpeta) + '</span><span class="txt"></span><span class="trail">' + svgIcono(IC.der) + '</span>';
          b.querySelector(".txt").textContent = c.name.trim();
          if (umbralNuevo !== null && (c.updated || 0) > umbralNuevo) b.insertBefore(crearBadge("✓ Nuevo"), b.querySelector(".trail"));
          b.onclick = () => abrir(c.id, c.name);
          g.appendChild(b);
        });
        cont.appendChild(g);
      }

      if (archivos.length) {
        const t = document.createElement("h3");
        t.textContent = "Archivos";
        cont.appendChild(t);
        const g = document.createElement("div");
        g.className = "lista";
        archivos.forEach(a => {
          const l = document.createElement("a");
          l.className = "fila";
          l.href = a.url;
          l.target = "_blank";
          l.rel = "noopener";
          l.onclick = (ev) => { ev.preventDefault(); abrirVisor(a, archivos); };
          const tipo = tipoArchivo(a.name);
          l.innerHTML = '<span class="ext"></span><span class="txt"><div class="nom"></div><div class="fec"></div></span>';
          const ext = l.querySelector(".ext");
          ext.textContent = tipo.etiqueta;
          if (tipo.clase) ext.classList.add(tipo.clase);
          l.querySelector(".nom").textContent = a.name;
          l.querySelector(".fec").textContent = fechaCorta(a.updated || 0);
          if (umbralNuevo !== null && (a.updated || 0) > umbralNuevo) l.appendChild(crearBadge("✓ Nuevo"));
          g.appendChild(l);
        });
        cont.appendChild(g);
      }

      if (!carpetas.length && !archivos.length) {
        cont.innerHTML = '<p class="msg">' + (f ? "Sin resultados." : "Esta carpeta está vacía.") + "</p>";
      }
    }

    function volver() {
      if (camino.length > 2) {
        const anterior = camino[camino.length - 2];
        abrir(anterior.id, anterior.name, camino.length - 2);
      } else if (origenMenu) {
        volverAlMenu();
      } else {
        irInicio();
      }
    }

    /* Al salir de una carpeta del menú: volver a donde estaba y reabrir el menú */
    async function volverAlMenu() {
      const prev = vistaPrevia;
      origenMenu = false;
      vistaPrevia = null;
      if (prev && prev.v === "c") {
        camino = prev.camino.slice();
        const u = camino[camino.length - 1];
        await abrir(u.id, u.name, camino.length - 1);
      } else {
        await irInicio();
      }
      abrirMenu();
    }

    function filtrar() {
      if (actual) dibujar(actual, document.getElementById("buscador").value);
    }

    /* MENU */
    function abrirMenu() {
      document.getElementById("menu").classList.add("abierto");
      document.getElementById("fondoMenu").classList.add("abierto");
    }
    function cerrarMenu() {
      document.getElementById("menu").classList.remove("abierto");
      document.getElementById("fondoMenu").classList.remove("abierto");
    }

    /* VISOR */
    const esImagen = (a) => /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(a.name);
    let grupoVisor = [];  // imágenes de la misma carpeta, para pasar de una a otra
    let idxVisor = 0;

    /* los PDF y otros archivos van en el visor de Drive; se crea uno nuevo cada vez para no ensuciar el historial */
    function mostrarComoFrame(a) {
      document.getElementById("visorImgWrap").style.display = "none";
      const nuevo = document.createElement("iframe");
      nuevo.id = "visorFrame";
      nuevo.setAttribute("allow", "autoplay");
      nuevo.setAttribute("allowfullscreen", "");
      nuevo.src = "https://drive.google.com/file/d/" + a.id + "/preview";
      document.getElementById("visorFrame").replaceWith(nuevo);
    }

    /* las imágenes se muestran directamente en la página, para poder deslizar */
    function mostrarEnVisor(a) {
      document.getElementById("visorNombre").textContent = a.name;
      document.getElementById("visorLink").href = a.url;
      if (esImagen(a)) {
        const vacio = document.createElement("iframe");
        vacio.id = "visorFrame";
        vacio.style.display = "none";
        document.getElementById("visorFrame").replaceWith(vacio);
        document.getElementById("visorImgWrap").style.display = "flex";
        const img = document.getElementById("visorImg");
        img.style.opacity = 0;
        img.onload = () => { img.style.opacity = 1; };
        img.onerror = () => { mostrarComoFrame(a); };
        img.src = "https://drive.google.com/thumbnail?id=" + a.id + "&sz=w2000";
      } else {
        mostrarComoFrame(a);
      }
      actualizarNavVisor();
    }

    function actualizarNavVisor() {
      const a = grupoVisor[idxVisor];
      const hay = !!a && esImagen(a) && grupoVisor.length > 1;
      const prev = document.getElementById("visorPrev");
      const next = document.getElementById("visorNext");
      const pos = document.getElementById("visorPos");
      prev.style.display = next.style.display = pos.style.display = hay ? "block" : "none";
      prev.disabled = idxVisor <= 0;
      next.disabled = idxVisor >= grupoVisor.length - 1;
      pos.textContent = hay ? (idxVisor + 1) + " / " + grupoVisor.length : "";
    }

    function visorMover(d) {
      const n = idxVisor + d;
      if (n < 0 || n >= grupoVisor.length) return;
      idxVisor = n;
      mostrarEnVisor(grupoVisor[n]);
    }

    function abrirVisor(a, lista) {
      if (!navigator.onLine) {
        alert("Sin internet: los archivos se abren solo con conexión.");
        return;
      }
      const base = lista && lista.length ? lista : [a];
      grupoVisor = esImagen(a) ? base.filter(esImagen) : [a];
      idxVisor = Math.max(0, grupoVisor.findIndex(x => x.id === a.id));
      mostrarEnVisor(a);
      document.getElementById("visor").classList.add("abierto");
      document.body.style.overflow = "hidden";
      try { history.pushState(Object.assign({ visor: true }, vistaActual()), ""); } catch (e) {}
    }
    function cerrarVisorInterno() {
      document.getElementById("visor").classList.remove("abierto");
      document.getElementById("visorImgWrap").style.display = "none";
      const img = document.getElementById("visorImg");
      img.onload = img.onerror = null;
      img.removeAttribute("src");
      img.style.opacity = 0;
      const vacio = document.createElement("iframe");
      vacio.id = "visorFrame";
      document.getElementById("visorFrame").replaceWith(vacio);
      document.body.style.overflow = "";
    }

    /* deslizar con el dedo: izquierda = siguiente, derecha = anterior */
    (function () {
      const wrap = document.getElementById("visorImgWrap");
      let x0 = 0, y0 = 0, multi = false;
      wrap.addEventListener("touchstart", (e) => {
        multi = e.touches.length > 1;
        if (!multi) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }
      }, { passive: true });
      wrap.addEventListener("touchend", (e) => {
        if (multi) return;
        if (window.visualViewport && window.visualViewport.scale > 1.05) return; // con zoom no se desliza
        const t = e.changedTouches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) visorMover(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();
    function cerrarVisor() {
      if (history.state && history.state.visor) { history.back(); return; }
      cerrarVisorInterno();
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { cerrarVisor(); cerrarMenu(); }
      else if (document.getElementById("visor").classList.contains("abierto")) {
        if (e.key === "ArrowRight") visorMover(1);
        else if (e.key === "ArrowLeft") visorMover(-1);
      }
    });

    function estadoRed() {
      document.getElementById("sinRed").style.display = navigator.onLine ? "none" : "block";
    }
    window.addEventListener("online", estadoRed);
    window.addEventListener("offline", estadoRed);
    estadoRed();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }

    window.addEventListener("popstate", async (ev) => {
      cerrarMenu();
      cerrarVisorInterno();
      const s = ev.state;
      if (!s || !s.v) return;
      const mismo = s.v === (enInicio ? "i" : "c") && JSON.stringify(s.camino) === JSON.stringify(camino);
      if (mismo) return;
      const veniaDeMenu = origenMenu && !enInicio && camino.length === 2;
      restaurando = true;
      try {
        if (s.v === "i") await irInicio();
        else {
          camino = s.camino.slice();
          const ult = camino[camino.length - 1];
          await abrir(ult.id, ult.name, camino.length - 1);
        }
        origenMenu = !!s.m;
      } finally { restaurando = false; }
      if (veniaDeMenu && !s.m) abrirMenu();
    });

    irInicio();
  </script>
